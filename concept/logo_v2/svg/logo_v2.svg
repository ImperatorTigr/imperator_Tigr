<!--?xml version="1.0" encoding="UTF-8"?-->

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" fill="none">

    <defs>

        <linearGradient id="frameStroke" x1="60" y1="60" x2="840" y2="840" gradientUnits="userSpaceOnUse">

            <stop offset="0%" stop-color="#F4D88F"></stop>
            <stop offset="45%" stop-color="#CFA14A"></stop>
            <stop offset="100%" stop-color="#8E6521"></stop>

        </linearGradient>

        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">

            <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity=".35"></feDropShadow>

        </filter>

    </defs>

    <g filter="url(#softShadow)">

        <!-- Background -->

        <rect x="60" y="60" width="780" height="780" rx="36" fill="rgba(255,255,255,0.015)" stroke="url(#frameStroke)" stroke-width="6"></rect>

        <!-- Vertical -->

        <line x1="320" y1="60" x2="320" y2="840" stroke="#F4D88F" stroke-opacity=".28" stroke-width="3"></line>

        <line x1="580" y1="60" x2="580" y2="840" stroke="#F4D88F" stroke-opacity=".28" stroke-width="3"></line>

        <!-- Horizontal -->

        <line x1="60" y1="320" x2="840" y2="320" stroke="#F4D88F" stroke-opacity=".28" stroke-width="3"></line>

        <line x1="60" y1="580" x2="840" y2="580" stroke="#F4D88F" stroke-opacity=".28" stroke-width="3"></line>

    </g>

</svg>